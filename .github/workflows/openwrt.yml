name: OpenWrt x86_64 Daede

on:
  # 手动触发（推荐保留，用于测试）
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本 (如 v25.12.4)'
        required: true
        default: 'v25.12.4'
      openwrt_branch:
        description: 'OpenWrt 分支'
        required: false
        default: 'master'

  # 从创建 Release 时自动触发
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
            echo "使用 Release Tag: ${{ github.event.release.tag_name }}"
          else
            echo "VERSION=${{ inputs.openwrt_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y qemu-utils bc binutils-gold bison build-essential ccache ecj fastjar file flex g++ gawk gcc-arm* gettext git help2man libbsd-dev libelf-dev liblzma-dev libncurses-dev libssl-dev mtd-utils meson mold ninja-build pbzip2 pigz pkg-config python3-dev python3-setuptools rsync subversion swig texinfo time u-boot-tools unzip wget xsltproc xxd zlib1g-dev zstd clang llvm npm cmake
          sudo npm install -g pnpm

      - name: Clone OpenWrt
        run: |
          git clone https://github.com/openwrt/openwrt.git  openwrt
          cd openwrt    
          git checkout ${{ steps.version.outputs.VERSION || 'v25.12.4' }}

      - name: Add Packages
        run: |
          cd openwrt
          #git clone https://github.com/kenzok8/openwrt-daede.git package/daede
          #git clone --depth=1 https://github.com/vernesong/OpenClash.git package/luci-app-openclash
          #git clone https://github.com/sbwml/luci-app-mosdns -b v5 package/mosdns
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply .config
        run: |
          cd openwrt
          rm -f .config
          rm -f tmp/.config-package.in
          cat << 'EOF' > .config
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_VHDX_IMAGES=y
          EOF
          
          cat << 'EOF' >> .config
          # ===== eBPF & BTF 深度内核黄金配置 =====
          CONFIG_KERNEL_BPF=y
          CONFIG_KERNEL_BPF_SYSCALL=y
          CONFIG_KERNEL_BPF_JIT=y
          CONFIG_KERNEL_CGROUPS=y
          CONFIG_KERNEL_KPROBES=y
          CONFIG_KERNEL_NET_INGRESS=y
          CONFIG_KERNEL_NET_EGRESS=y
          CONFIG_KERNEL_NET_SCH_INGRESS=m
          CONFIG_KERNEL_NET_CLS_BPF=m
          CONFIG_KERNEL_NET_CLS_ACT=y
          CONFIG_KERNEL_BPF_STREAM_PARSER=y
          CONFIG_KERNEL_DEBUG_INFO=y
          CONFIG_KERNEL_DEBUG_INFO_REDUCED=n
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_KPROBE_EVENTS=y
          CONFIG_KERNEL_BPF_EVENTS=y
          
          # ===== 网页后台 & 简体中文 & 网页终端 =====
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_LUCI_LANG_zh-cn=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_ttyd=y
          
          # ===== 固件分区深度扩容 (防体积爆炸) =====
          CONFIG_TARGET_KERNEL_PARTSIZE=200
          CONFIG_TARGET_ROOTFS_PARTSIZE=300
          
          # ===== 拒绝多余格式：精简为纯原生固件 =====
          CONFIG_TARGET_IMAGES_GZIP=n
          CONFIG_TARGET_ROOTFS_TARGZ=n
          CONFIG_TARGET_ROOTFS_EXT4FS=n
          CONFIG_X86_GRUB_EFI_IMAGES=n
          
          # ===== 高级分流网络组件无缝替换 =====
          CONFIG_PACKAGE_dnsmasq=n
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_dnsmasq_full_dhcp=y
          CONFIG_PACKAGE_dnsmasq_full_dnssec=y
          CONFIG_PACKAGE_dnsmasq_full_ipset=y
          CONFIG_PACKAGE_dnsmasq_full_nftset=y
          
          # ===== USB 3.0 / 2.0 控制器及外挂 USB 有线网卡与存储驱动 =====
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-scsi-core=y
          
          # ===== 彻底剥离全套无用 IPv6 功能 (只要纯净 IPv4) =====
          CONFIG_VOLUME_DEFAULTS_IPV6=n
          CONFIG_IPV6=n
          CONFIG_KERNEL_IPV6=n
          CONFIG_PACKAGE_kmod-ipv6=n
          CONFIG_PACKAGE_kmod-ipt-ipv6=n
          CONFIG_PACKAGE_kmod-nf-ipt6=n
          CONFIG_PACKAGE_kmod-ip6tables=n
          CONFIG_PACKAGE_ip6tables=n
          CONFIG_PACKAGE_ip6tables-extra=n
          CONFIG_PACKAGE_ip6tables-mod-nat=n
          CONFIG_PACKAGE_dnsmasq_full_dhcpv6=n
          CONFIG_PACKAGE_odhcpd=n
          CONFIG_PACKAGE_odhcpd-ipv6only=n
          CONFIG_PACKAGE_luci-proto-ipv6=n
          EOF
       
          #  echo "CONFIG_NETKIT=y" >>  target/linux/x86/config-6.12        
          make defconfig 
      - name: Download & Compile
        run: |
          cd openwrt
          make download -j$(nproc)
          make -j$(nproc) V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-x86_64-Daede
          path: openwrt/bin/targets/x86/64/*

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2   # 已使用 v2 解决 Node 20 警告
        with:
          files: |
            openwrt/bin/targets/x86/64/*.img.gz
            openwrt/bin/targets/x86/64/*.vhdx
            openwrt/bin/targets/x86/64/*.squashfs.img
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
